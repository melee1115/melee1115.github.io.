<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dice Roller">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Dice Roller PWA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-top: 20px;
      margin-bottom: 20px;
      font-size: 2rem;
    }
    #history {
      background-color: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }
    #history h2 {
      font-size: 1rem;
      color: #666;
      margin-bottom: 10px;
    }
    #rollsList {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      min-height: 30px;
    }
    .roll-item {
      background-color: #007AFF;
      color: white;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 1.2rem;
      font-weight: 600;
    }
    .no-rolls {
      color: #999;
      font-style: italic;
    }
    #dice {
      font-size: 7rem;
      margin: 30px 0;
      font-weight: bold;
      color: #333;
    }
    button {
      font-size: 1.5rem;
      padding: 15px 40px;
      border-radius: 12px;
      border: none;
      background-color: #007AFF;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
      -webkit-user-select: none;
      user-select: none;
      min-width: 150px;
    }
    button:active {
      background-color: #0051D5;
    }
    button:hover {
      background-color: #0051D5;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .spinner {
      display: inline-block;
      width: 1em;
      height: 1em;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #clearBtn {
      font-size: 0.9rem;
      padding: 8px 16px;
      background-color: #ff3b30;
      margin-top: 10px;
    }
    #clearBtn:hover {
      background-color: #d32f2a;
    }
  </style>
</head>
<body>
  <h1>🎲 Dice Roller</h1>
  
  <div id="history">
    <h2>Roll History</h2>
    <div id="rollsList" class="no-rolls">No rolls yet</div>
    <button id="clearBtn">Clear History</button>
  </div>

  <div id="dice" aria-live="polite">1</div>
  <button id="rollBtn">Roll</button>

  <script>
    const rollBtn = document.getElementById('rollBtn');
    const rollsList = document.getElementById('rollsList');
    const clearBtn = document.getElementById('clearBtn');

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('rollHistory')) || [];
      return history;
    }

    function saveHistory(history) {
      localStorage.setItem('rollHistory', JSON.stringify(history));
    }

    function displayHistory() {
      const history = loadHistory();
      if (history.length === 0) {
        rollsList.innerHTML = '<span class="no-rolls">No rolls yet</span>';
      } else {
        rollsList.innerHTML = history.map(roll => `<span class="roll-item">${roll}</span>`).join('');
      }
    }

    function rollDice() {
      // Disable button and show loading state
      rollBtn.disabled = true;
      rollBtn.innerHTML = '<span class="spinner"></span>Rolling...';

      // Simulate a small delay for visual effect
      setTimeout(() => {
        const roll = Math.floor(Math.random() * 6) + 1;
        document.getElementById('dice').textContent = roll;

        // Add to history
        const history = loadHistory();
        history.push(roll);
        saveHistory(history);
        displayHistory();

        // Re-enable button and restore text
        rollBtn.disabled = false;
        rollBtn.textContent = 'Roll';
      }, 500);
    }

    function clearHistory() {
      if (confirm('Are you sure you want to clear all roll history?')) {
        localStorage.setItem('rollHistory', JSON.stringify([]));
        displayHistory();
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      displayHistory();
      rollBtn.addEventListener('click', rollDice);
      clearBtn.addEventListener('click', clearHistory);
    });

    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(err => {
        console.log('Service Worker registration failed:', err);
      });
    }
  </script>
</body>
</html>
