<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dice Roller">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Dice Roller PWA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin-top: 50px;
      background-color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 2rem;
    }
    #dice {
      font-size: 7rem;
      margin: 30px 0;
      font-weight: bold;
      color: #333;
    }
    button {
      font-size: 1.5rem;
      padding: 15px 40px;
      border-radius: 12px;
      border: none;
      background-color: #007AFF;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
      -webkit-user-select: none;
      user-select: none;
      min-width: 150px;
    }
    button:active {
      background-color: #0051D5;
    }
    button:hover {
      background-color: #0051D5;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .spinner {
      display: inline-block;
      width: 1em;
      height: 1em;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>🎲 Dice Roller</h1>
  <div id="dice" aria-live="polite">1</div>
  <button id="rollBtn">Roll</button>

  <script>
    const rollBtn = document.getElementById('rollBtn');

    function rollDice() {
      // Disable button and show loading state
      rollBtn.disabled = true;
      rollBtn.innerHTML = '<span class="spinner"></span>Rolling...';

      // Simulate a small delay for visual effect (you can adjust this)
      setTimeout(() => {
        const roll = Math.floor(Math.random() * 6) + 1;
        document.getElementById('dice').textContent = roll;
        localStorage.setItem('lastDiceRoll', roll);

        // Re-enable button and restore text
        rollBtn.disabled = false;
        rollBtn.textContent = 'Roll';
      }, 500);
    }

    window.addEventListener('DOMContentLoaded', function() {
      const lastRoll = localStorage.getItem('lastDiceRoll');
      if (lastRoll !== null) {
        document.getElementById('dice').textContent = lastRoll;
      }
      rollBtn.addEventListener('click', rollDice);
    });

    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(err => {
        console.log('Service Worker registration failed:', err);
      });
    }
  </script>
</body>
</html>
